<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای فوتبال</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f0f2f5;
            margin: 0;
            text-align: center;
        }
        header {
            background: #087830;
            color: white;
            padding: 25px;
        }
        nav {
            background: #064d20;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 12px;
            text-decoration: none;
        }
        main {
            padding: 25px;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 15px auto;
            max-width: 600px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1>⚽ دنیای فوتبال</h1>
        <p>آخرین اخبار و اطلاعات فوتبالی</p>
    </header>

    <nav>
        <a href="#news">اخبار فوتبال</a>
        <a href="#teams">تیم‌ها</a>
        <a href="#about">درباره ما</a>
    </nav>

    <main>
        <section class="card" id="news">
            <h2>📰 اخبار فوتبال</h2>
            <p>به سایت فوتبالی ما خوش آمدید!</p>
            <p>به‌زودی اخبار جدید فوتبال را اینجا منتشر می‌کنیم.</p>
        </section>

        <section class="card" id="teams">
            <h2>🏆 تیم‌های فوتبال</h2>
            <p>استقلال | پرسپولیس | فولاد خوزستان | رئال مادرید</p>
        </section>

        <section class="card" id="about">
            <h2>درباره ما</h2>
            <p>اینجا جایی برای علاقه‌مندان به فوتبال است.</p>
        </section>
    </main>
</body>
</html>
